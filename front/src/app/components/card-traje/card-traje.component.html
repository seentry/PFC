<div class="card shadow" style="width: 300px; height: 450px; overflow: hidden; display: flex; flex-direction: column;">
  <img
    [src]="tipo === 'gala' ? '/assets/gala.jpg' : '/assets/normal.jpg'"
    alt="Imagen del traje"
    class="card-img-top"
    style="height: 180px; object-fit: cover;"
  >
  <div class="card-body text-center d-flex flex-column" style="flex: 1;">
    <h5 class="card-title fw-bold">Traje: {{ tipo | titlecase }}</h5>
    <div class="card-text-container" data-simplebar data-simplebar-auto-hide="false" style="max-height: 120px;">
      <div style="padding-right: 12px;">
        <p class="card-text text-muted">
          Dueño: {{ duenoOriginal.nombre }} {{ duenoOriginal.apellidos }}<br>
          Talla: {{ talla }}<br>
          Estado: {{ estado | titlecase }}<br>
          Disponible: {{ disponible ? 'Sí' : 'No' }}
        </p>
      </div>
    </div>
  </div>
</div>
