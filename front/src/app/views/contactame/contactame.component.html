<div class="container mt-5 p-4 rounded shadow" style="background-color: #343a40;">
    <h2 class="text-center mb-4 text-white">Contáctanos</h2>
    <div class="row justify-content-center">
      <div class="col-md-8">
        <form>
          <div class="mb-3">
            <label for="nombre" class="form-label text-light">Nombre</label>
            <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Tu nombre" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label text-light">Correo electrónico</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="tuemail@ejemplo.com" required>
          </div>
          <div class="mb-3">
            <label for="asunto" class="form-label text-light">Asunto</label>
            <input type="text" id="asunto" name="asunto" class="form-control" placeholder="Asunto del mensaje" required>
          </div>
          <div class="mb-3">
            <label for="mensaje" class="form-label text-light">Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="5" class="form-control" placeholder="Escribe aquí tu mensaje" required></textarea>
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-primary px-4">Enviar mensaje</button>
          </div>
        </form>
      </div>
    </div>
  </div>
