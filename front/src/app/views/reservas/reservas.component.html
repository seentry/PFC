<h2 class="text-center mt-5 mb-4">Reservas de Trajes Disponibles</h2>

<div class="row justify-content-center">
  <div class="col-md-10">
    <div class="d-flex flex-wrap justify-content-center gap-5">
      @for (traje of trajesPaginados; track traje.id) {
        <app-card-traje
          [id]="traje.id"
          [tipo]="traje.tipo"
          [talla]="traje.talla"
          [estado]="traje.estado"
          [duenoOriginal]="traje.duenoOriginal"
          [fechaIncorporacion]="traje.fechaIncorporacion"
          (reservaTrajes)="reservarTraje(traje.id)">
        </app-card-traje>
      }
    </div>

    <div class="pagination d-flex justify-content-center mt-5">
      <button (click)="prevPage()" [disabled]="currentPage === 1" class="btn btn-primary me-2">
        Anterior
      </button>
      <span class="fs-5 fw-bold mx-3">
        Página {{ currentPage }} de {{ totalPages() }}
      </span>
      <button (click)="nextPage()" [disabled]="currentPage === totalPages()" class="btn btn-primary ms-2">
        Siguiente
      </button>
    </div>
  </div>
</div>
